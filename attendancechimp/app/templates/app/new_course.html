<!DOCTYPE html>
<html>
    <head><title>New Courses</title></head>
    <body>
        <h1>New Courses</h1>
        <form method="post" action="/app/createCourse">
            {% csrf_token %}
            <p><label>Course Name:<input type="text" name="course-name" maxlength="200" required></label></p>
            <p><label>Start time:<input type="text" name="start-time" required></label></p>
            <p><label>End time:<input type="text" name="end-time" required></label></p>
            <p>Choose at least one day</p>
            <label><input type="checkbox" name="day-mon"> Monday</label>
            <label><input type="checkbox" name="day-tue"> Tuesday</label>
            <label><input type="checkbox" name="day-wed"> Wednesday</label>
            <label><input type="checkbox" name="day-thu"> Thursday</label>
            <label><input type="checkbox" name="day-fri"> Friday</label>
            <p><button type="submit">Create Course</button></p>
        </form>
    </body>
</html>
