<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
        .username { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Hello, this is a web app made with Django. Made for students and instructors.</p>
    <hr>
    {% if user.is_authenticated %}
        <p>Logged in as:<b> {{ user.username }}</b></p>
    {% else %}
        <p>Not logged in.</p>
    {% endif %}
    <p>Current Time: {{ current_time }}</p>
</div>
</body>
</html>
